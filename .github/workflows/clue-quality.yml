name: Clue5 Clue Quality
on:
  push:
    branches: [main]
    paths:
      - "server/daily-pool.cjs"
      - "server/daily-expansion.cjs"
      - "data/practice.js"
      - "scripts/audit-expansions.cjs"
      - "scripts/audit-all.cjs"
      - "scripts/audit-clue-progression.cjs"
      - "scripts/test-answer-aliases.cjs"
      - "scripts/audit-answer-coverage.cjs"
      - "scripts/audit-cross-case-matching.cjs"
      - "assets/answer-aliases.js"
      - "assets/answer-match.js"
      - "scripts/audit-site.cjs"
      - "tests/answer-match.test.cjs"
      - "index.html"
      - "how-to-play.html"
      - "privacy.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/adsense.js"
      - "assets/adsense-config.js"
      - "assets/account.js"
      - "api/daily.js"
      - "service-worker.js"
      - ".github/workflows/clue-quality.yml"
  pull_request:
    paths:
      - "server/daily-pool.cjs"
      - "server/daily-expansion.cjs"
      - "data/practice.js"
      - "scripts/audit-expansions.cjs"
      - "scripts/test-answer-aliases.cjs"
      - "scripts/audit-answer-coverage.cjs"
      - "scripts/audit-cross-case-matching.cjs"
      - "assets/answer-aliases.js"
      - "assets/answer-match.js"
      - "scripts/audit-site.cjs"
      - "tests/answer-match.test.cjs"
      - "index.html"
      - "how-to-play.html"
      - "privacy.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/adsense.js"
      - "assets/adsense-config.js"
      - "assets/account.js"
      - "api/daily.js"
      - "service-worker.js"
      - ".github/workflows/clue-quality.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared answer matching\n        run: node tests/answer-match.test.cjs\n      - name: Validate website SEO, navigation and ads\n        run: node scripts/audit-site.cjs\n      - name: Check client and API JavaScript syntax\n        run: |\n          node --check assets/adsense.js\n          node --check assets/account.js\n          node --check assets/answer-match.js\n          node --check api/daily.js\n      - name: Test Daily and Unlimited answer aliases
        run: node scripts/test-answer-aliases.cjs
      - name: Audit every Daily and Unlimited answer variant and collision
        run: node scripts/audit-answer-coverage.cjs
      - name: Reject wrong-answer matches across different cases
        run: node scripts/audit-cross-case-matching.cjs
      - name: Audit five-clue progression and repeated evidence
        run: node scripts/audit-clue-progression.cjs
      - name: Audit new-case quality
        run: node scripts/audit-expansions.cjs
      - name: Audit complete Clue5 library
        run: node scripts/audit-all.cjs
